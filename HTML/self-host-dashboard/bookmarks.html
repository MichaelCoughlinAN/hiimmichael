<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bookmarks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

        :root {
            --bg: #f0ede8;
            --surface: rgba(255,255,255,0.72);
            --surface-hover: rgba(255,255,255,0.92);
            --border: rgba(0,0,0,0.07);
            --border-hover: rgba(0,0,0,0.14);
            --text: #111;
            --text2: #666;
            --text3: #999;
            --link: #1a6ef5;
            --pill-bg: rgba(0,0,0,0.05);
            --pill-border: rgba(0,0,0,0.09);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.08), 0 16px 40px rgba(0,0,0,0.07);
            --danger: #d04040;
            --mono: 'DM Mono', monospace;
            --serif: 'Instrument Serif', serif;
            --sans: 'Geist', sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0e0f;
                --surface: rgba(26,26,30,0.8);
                --surface-hover: rgba(34,34,38,0.95);
                --border: rgba(255,255,255,0.07);
                --border-hover: rgba(255,255,255,0.14);
                --text: #f0f0f0;
                --text2: #888;
                --text3: #555;
                --link: #5b9cf6;
                --pill-bg: rgba(255,255,255,0.06);
                --pill-border: rgba(255,255,255,0.1);
                --shadow-hover: 0 4px 12px rgba(0,0,0,0.4), 0 16px 40px rgba(0,0,0,0.3);
                --danger: #e05555;
            }
        }

        html, body {
            min-height: 100%;
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .shell {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem 6rem;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.6rem 0 0;
            animation: fadeUp .5s ease both;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            font-family: var(--mono);
            font-size: .75rem;
            color: var(--text3);
            text-decoration: none;
            letter-spacing: .04em;
            transition: color .15s;
        }
        .back-link:hover { color: var(--text2); }
        .back-link svg {
            width: 13px; height: 13px;
            stroke: currentColor; fill: none;
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
        }

        .topbar-actions { display: flex; gap: .5rem; }

        .btn {
            font-family: var(--mono);
            font-size: .75rem;
            letter-spacing: .04em;
            padding: .4rem .85rem;
            border-radius: 8px;
            border: 1px solid var(--border-hover);
            background: var(--surface);
            color: var(--text2);
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s, transform .12s;
            backdrop-filter: blur(8px);
        }
        .btn:hover { background: var(--surface-hover); color: var(--text); transform: translateY(-1px); }
        .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
        .btn-primary:hover { opacity: .85; color: var(--bg); background: var(--text); transform: translateY(-1px); }

        .hero {
            padding: 3rem 0 2.4rem;
            animation: fadeUp .55s .05s ease both;
        }

        .hero-eyebrow {
            font-family: var(--mono);
            font-size: .7rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: .9rem;
        }

        h1 {
            font-family: var(--serif);
            font-size: clamp(2.8rem, 7vw, 4.4rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -.02em;
            color: var(--text);
        }
        h1 em { font-style: italic; color: var(--text2); }

        .hero-sub {
            font-family: var(--mono);
            font-size: .75rem;
            color: var(--text3);
            margin-top: .7rem;
        }

        kbd {
            font-family: var(--mono);
            background: var(--pill-bg);
            border: 1px solid var(--border-hover);
            padding: .1rem .4rem;
            border-radius: 4px;
            font-size: .7rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            margin-bottom: 1.6rem;
            animation: fadeUp .55s .15s ease both;
        }

        .search-wrap { position: relative; }
        .search-icon {
            position: absolute;
            left: .9rem; top: 50%;
            transform: translateY(-50%);
            color: var(--text3);
            font-size: 1rem;
            pointer-events: none;
        }

        input[type="search"], input[type="text"], input[type="url"] {
            width: 100%;
            font-family: var(--mono);
            font-size: .82rem;
            padding: .65rem .9rem .65rem 2.4rem;
            background: var(--surface);
            border: 1px solid var(--border-hover);
            border-radius: 10px;
            color: var(--text);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            backdrop-filter: blur(8px);
        }
        input[type="text"], input[type="url"] { padding-left: .9rem; }
        input::placeholder { color: var(--text3); }
        input:focus { border-color: var(--link); box-shadow: 0 0 0 3px rgba(26,110,245,0.1); }

        .tags-row { display: flex; gap: .4rem; flex-wrap: wrap; }

        .tag {
            font-family: var(--mono);
            font-size: .7rem;
            letter-spacing: .06em;
            padding: .28rem .65rem;
            border-radius: 100px;
            border: 1px solid var(--border-hover);
            background: var(--pill-bg);
            color: var(--text3);
            cursor: pointer;
            transition: all .15s;
        }
        .tag:hover { color: var(--text2); background: var(--surface); }
        .tag.active { background: var(--text); border-color: var(--text); color: var(--bg); }

        .section-label {
            font-family: var(--mono);
            font-size: .68rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: .7rem;
            animation: fadeUp .55s .2s ease both;
        }

        .list-wrap { animation: fadeUp .55s .22s ease both; }

        .list-header {
            display: grid;
            grid-template-columns: 24px 1fr 140px 90px;
            gap: 1rem;
            padding: .35rem .85rem;
            font-family: var(--mono);
            font-size: .67rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text3);
            border-bottom: 1px solid var(--border);
            margin-bottom: .2rem;
        }

        .bookmark-row {
            display: grid;
            grid-template-columns: 24px 1fr 140px 90px;
            gap: 1rem;
            align-items: center;
            padding: .6rem .85rem;
            border-bottom: 1px solid var(--border);
            transition: background .12s;
            border-radius: 6px;
        }
        .bookmark-row:last-child { border-bottom: none; }
        .bookmark-row:hover { background: var(--surface); }

        .favicon {
            width: 18px; height: 18px;
            border-radius: 4px;
            object-fit: cover;
            background: var(--pill-bg);
        }

        .bm-name {
            font-size: .88rem;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color .12s;
        }
        .bm-name:hover { color: var(--link); }

        .bm-host {
            font-family: var(--mono);
            font-size: .71rem;
            color: var(--text3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bm-actions {
            display: flex;
            gap: .35rem;
            align-items: center;
            justify-content: flex-end;
        }

        .action-btn {
            font-family: var(--mono);
            font-size: .7rem;
            color: var(--text3);
            background: none;
            border: none;
            cursor: pointer;
            padding: .2rem .45rem;
            border-radius: 5px;
            transition: color .12s, background .12s;
            text-decoration: none;
        }
        .action-btn:hover { color: var(--text); background: var(--pill-bg); }
        .action-btn.del:hover { color: var(--danger); }

        .empty {
            text-align: center;
            padding: 4rem 0;
            color: var(--text3);
            font-family: var(--mono);
            font-size: .82rem;
        }

        .count-bar {
            display: flex;
            justify-content: space-between;
            padding: .9rem .4rem 0;
            font-family: var(--mono);
            font-size: .72rem;
            color: var(--text3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 440px;
            box-shadow: var(--shadow-hover);
            animation: scaleIn .2s cubic-bezier(.2,.8,.4,1) both;
        }
        .modal-eyebrow {
            font-family: var(--mono);
            font-size: .68rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: .4rem;
        }
        .modal h2 {
            font-family: var(--serif);
            font-size: 1.8rem;
            font-weight: 400;
            color: var(--text);
            letter-spacing: -.01em;
            margin-bottom: 1.4rem;
        }
        .modal h2 em { font-style: italic; color: var(--text2); }

        .modal-field { margin-bottom: .9rem; }
        .modal-field label {
            display: block;
            font-family: var(--mono);
            font-size: .68rem;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: .35rem;
        }
        .modal-actions {
            display: flex;
            gap: .6rem;
            margin-top: 1.4rem;
            justify-content: flex-end;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(.96) translateY(6px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        @media (max-width: 600px) {
            .list-header { display: none; }
            .bookmark-row { grid-template-columns: 24px 1fr 70px; }
            .bm-host { display: none; }
            h1 { font-size: 2.6rem; }
        }
    </style>
</head>
<body>
<div class="shell">

    <div class="topbar">
        <a class="back-link" href="index.html">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            dashboard
        </a>
        <div class="topbar-actions">
            <button class="btn" id="export-btn">Export</button>
            <button class="btn" id="copy-btn">Copy URLs</button>
            <button class="btn btn-primary" id="add-btn">+ Add</button>
        </div>
    </div>

    <div class="hero">
        <div class="hero-eyebrow" id="header-count">loading…</div>
        <h1>Book<em>marks</em></h1>
        <div class="hero-sub">press <kbd>/</kbd> to search</div>
    </div>

    <div class="controls">
        <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="search" id="search" placeholder="search by name or url…" autocomplete="off" spellcheck="false" />
        </div>
        <div class="tags-row" id="tags-row"></div>
    </div>

    <div class="section-label">Saved</div>
    <div class="list-wrap">
        <div class="list-header">
            <span></span>
            <span>Name</span>
            <span>Host</span>
            <span style="text-align:right">Actions</span>
        </div>
        <div id="list"></div>
        <div class="count-bar">
            <span id="count"></span>
            <span id="user-count"></span>
        </div>
    </div>

</div>

<div class="modal-overlay" id="modal">
    <div class="modal">
        <div class="modal-eyebrow" id="modal-eyebrow">New entry</div>
        <h2 id="modal-title">Add <em>Bookmark</em></h2>
        <div class="modal-field">
            <label>URL</label>
            <input type="url" id="new-url" placeholder="https://…" />
        </div>
        <div class="modal-field">
            <label>Name</label>
            <input type="text" id="new-name" placeholder="My favorite site" />
        </div>
        <div class="modal-field">
            <label>Tags <span style="opacity:.4;font-size:.65rem">(comma separated)</span></label>
            <input type="text" id="new-tags" placeholder="dev, reference, work" />
        </div>
        <div class="modal-actions">
            <button class="btn" id="modal-cancel">Cancel</button>
            <button class="btn btn-primary" id="modal-save">Save</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'homelab_bookmarks_v1';
    function loadUser() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
    function saveUser(l) { localStorage.setItem(STORAGE_KEY, JSON.stringify(l)); }
    function favicon(url) { try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; } catch { return ''; } }
    function host(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; } }

    let userAdded = loadUser();
    let allBookmarks = [];
    let filtered = [];
    let activeTag = null;
    let editingId = null;

    function merge() {
        allBookmarks = [
            ...userAdded.map(b => ({ ...b, _user: true })),
            ...CONFIG.bookmarks.map(b => ({ ...b, _user: false })),
        ];
    }

    function buildTags() {
        const counts = {};
        for (const b of allBookmarks) for (const t of (b.tags || [])) counts[t] = (counts[t] || 0) + 1;
        const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).map(e => e[0]);
        const row = document.getElementById('tags-row');
        row.innerHTML = '';
        const all = document.createElement('button');
        all.className = 'tag' + (activeTag === null ? ' active' : '');
        all.textContent = 'all';
        all.onclick = () => { activeTag = null; buildTags(); applyFilter(); };
        row.appendChild(all);
        for (const t of sorted) {
            const btn = document.createElement('button');
            btn.className = 'tag' + (activeTag === t ? ' active' : '');
            btn.textContent = t;
            btn.onclick = () => { activeTag = activeTag === t ? null : t; buildTags(); applyFilter(); };
            row.appendChild(btn);
        }
    }

    function applyFilter() {
        const q = document.getElementById('search').value.toLowerCase().trim();
        filtered = allBookmarks.filter(b => {
            const mq = !q || b.name.toLowerCase().includes(q) || b.url.toLowerCase().includes(q);
            const mt = !activeTag || (b.tags || []).includes(activeTag);
            return mq && mt;
        });
        render();
    }

    function render() {
        const cont = document.getElementById('list');
        cont.innerHTML = '';
        const total = allBookmarks.length;
        const tagCount = [...new Set(allBookmarks.flatMap(b => b.tags || []))].length;
        document.getElementById('header-count').textContent =
            `${total} bookmark${total !== 1 ? 's' : ''} · ${tagCount} tag${tagCount !== 1 ? 's' : ''}`;

        if (!filtered.length) {
            cont.innerHTML = '<div class="empty">no bookmarks found</div>';
            document.getElementById('count').textContent = '';
            document.getElementById('user-count').textContent = '';
            return;
        }

        for (const b of filtered) {
            const row = document.createElement('div');
            row.className = 'bookmark-row';

            const img = document.createElement('img');
            img.className = 'favicon';
            img.src = favicon(b.url);
            img.alt = '';
            img.onerror = () => { img.style.opacity = '0'; };

            const link = document.createElement('a');
            link.className = 'bm-name';
            link.href = b.url;
            link.target = '_blank';
            link.rel = 'noopener';
            link.textContent = b.name || b.url;
            link.title = b.url;

            const hostEl = document.createElement('span');
            hostEl.className = 'bm-host';
            hostEl.textContent = host(b.url);

            const actions = document.createElement('div');
            actions.className = 'bm-actions';

            if (b._user) {
                const edit = document.createElement('button');
                edit.className = 'action-btn';
                edit.textContent = 'edit';
                edit.onclick = () => openEdit(b);
                const del = document.createElement('button');
                del.className = 'action-btn del';
                del.textContent = 'del';
                del.onclick = () => { userAdded = userAdded.filter(u => u.url !== b.url); saveUser(userAdded); merge(); buildTags(); applyFilter(); };
                actions.append(edit, del);
            } else {
                const open = document.createElement('a');
                open.className = 'action-btn';
                open.href = b.url;
                open.target = '_blank';
                open.rel = 'noopener';
                open.textContent = 'open';
                actions.append(open);
            }

            row.append(img, link, hostEl, actions);
            cont.appendChild(row);
        }

        document.getElementById('count').textContent = `${filtered.length} of ${total}`;
        document.getElementById('user-count').textContent = userAdded.length ? `${userAdded.length} personal` : '';
    }

    const modal     = document.getElementById('modal');
    const nameInput = document.getElementById('new-name');
    const urlInput  = document.getElementById('new-url');
    const tagsInput = document.getElementById('new-tags');

    function openAdd() {
        editingId = null;
        document.getElementById('modal-eyebrow').textContent = 'New entry';
        document.getElementById('modal-title').innerHTML = 'Add <em>Bookmark</em>';
        nameInput.value = ''; urlInput.value = ''; tagsInput.value = '';
        modal.classList.add('open'); urlInput.focus();
    }

    function openEdit(b) {
        editingId = b.url;
        document.getElementById('modal-eyebrow').textContent = 'Edit entry';
        document.getElementById('modal-title').innerHTML = 'Edit <em>Bookmark</em>';
        nameInput.value = b.name || '';
        urlInput.value  = b.url  || '';
        tagsInput.value = (b.tags || []).join(', ');
        modal.classList.add('open'); nameInput.focus();
    }

    function closeModal() { modal.classList.remove('open'); editingId = null; }

    function saveModal() {
        let url = urlInput.value.trim();
        if (!url) { urlInput.focus(); return; }
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const name = nameInput.value.trim() || host(url);
        const tags = tagsInput.value.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
        if (editingId) {
            const idx = userAdded.findIndex(u => u.url === editingId);
            if (idx !== -1) userAdded[idx] = { name, url, tags };
            else userAdded.unshift({ name, url, tags });
        } else {
            userAdded.unshift({ name, url, tags });
        }
        saveUser(userAdded); merge(); buildTags(); applyFilter(); closeModal();
    }

    document.getElementById('add-btn').onclick     = openAdd;
    document.getElementById('modal-cancel').onclick = closeModal;
    document.getElementById('modal-save').onclick   = saveModal;
    modal.onclick = e => { if (e.target === modal) closeModal(); };
    [nameInput, urlInput, tagsInput].forEach(el => {
        el.onkeydown = e => { if (e.key === 'Enter') saveModal(); if (e.key === 'Escape') closeModal(); };
    });

    document.getElementById('search').oninput = applyFilter;

    document.getElementById('export-btn').onclick = () => {
        const blob = new Blob([JSON.stringify(filtered, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = 'bookmarks.json'; a.click(); URL.revokeObjectURL(a.href);
    };

    document.getElementById('copy-btn').onclick = async () => {
        if (!filtered.length) return;
        await navigator.clipboard.writeText(filtered.map(b => b.url).join('\n'));
        const btn = document.getElementById('copy-btn');
        const orig = btn.textContent; btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 1800);
    };

    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('search').focus(); }
        if (e.key === 'Escape') closeModal();
    });

    merge(); buildTags(); applyFilter();
</script>
</body>
</html>
