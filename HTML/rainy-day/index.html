<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rainy Day</title>
  <style>
    /* Base Styles */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #2c3e50;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    /* Rain Container */
    .rain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Content */
    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding-top: 20vh;
    }

    /* Raindrop Animation */
    .raindrop {
      position: absolute;
      width: 2px;
      height: 30px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50% 50% 0 0;
      animation: fall linear infinite;
      opacity: 0.7;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100vh);
        opacity: 0.7;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    /* Splash Effect */
    .splash {
      position: absolute;
      width: 5px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      animation: splash-animation 0.3s ease-out;
      opacity: 0;
    }

    @keyframes splash-animation {
      0% {
        transform: scale(0.1);
        opacity: 0.9;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="rain-container"></div>
  <div class="content">
    <h1>Hello, little rainy world!</h1>
  </div>

  <script>
    const rainContainer = document.querySelector('.rain-container');
    const numberOfDrops = 120; // reduced for smoother performance

    // Create all drops in a single batch for better performance
    const fragment = document.createDocumentFragment();

    for (let i = 0; i < numberOfDrops; i++) {
      const drop = document.createElement('div');
      drop.classList.add('raindrop');
      drop.style.left = `${Math.random() * 100}vw`;
      const size = Math.random() * 0.5 + 0.5;
      drop.style.transform = `scale(${size})`;
      drop.style.animationDuration = `${Math.random() * 2 + 1}s`;
      drop.style.animationDelay = `-${Math.random() * 2}s`;
      fragment.appendChild(drop);

      drop.addEventListener('animationiteration', () => {
        createSplash(drop);
      });
    }

    rainContainer.appendChild(fragment);

    function createSplash(drop) {
      const splash = document.createElement('div');
      splash.classList.add('splash');
      splash.style.left = drop.style.left;
      splash.style.top = `${window.innerHeight - 5}px`;
      rainContainer.appendChild(splash);
      setTimeout(() => splash.remove(), 300);
    }
  </script>
</body>
</html>
